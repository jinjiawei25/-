            function stopTyping() {
                if (state.typingInterval) {
                    clearInterval(state.typingInterval);
                    state.typingInterval = null;
                }
                state.typing = false;
            }

            function typeText(fullText, callback) {
                stopTyping();
                state.typing = true;
                let index = 0;
                dialogueEl.textContent = '';

                if (state.skipTyping) {
                    dialogueEl.textContent = fullText;
                    state.typing = false;
                    state.skipTyping = false;
                    if (callback) callback();
                    return;
                }

                if (fullText.length < 10) {
                    dialogueEl.textContent = fullText;
                    state.typing = false;
                    if (callback) callback();
                    return;
                }

                state.typingInterval = setInterval(() => {
                    if (index < fullText.length) {
                        dialogueEl.textContent += fullText[index];
                        index++;
                    } else {
                        stopTyping();
                        if (callback) callback();
                    }
                }, 30);
            }

            // 购物游戏渲染函数
            function renderShoppingGame() {
                const items = ['刻刀', '火油', '麻绳', '护符'];
                const prices = {
                    刻刀: { 摊位A: 3, 摊位B: 4, 摊位C: 2 },
                    火油: { 摊位A: 4, 摊位B: 3, 摊位C: 5 },
                    麻绳: { 摊位A: 2, 摊位B: 3, 摊位C: 4 },
                    护符: { 摊位A: 5, 摊位B: 4, 摊位C: 3 }
                };

                const form = document.createElement('div');
                form.innerHTML = '<h3 style="color:#ffe3b0;">选择每件物品的购买摊位：</h3>';

                items.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'shop-item';
                    div.innerHTML = `<div>${item}</div>`;
                    const priceDiv = document.createElement('div');
                    priceDiv.className = 'price-options';
                    ['摊位A', '摊位B', '摊位C'].forEach(stall => {
                        const label = document.createElement('label');
                        label.innerHTML = `<input type="radio" name="${item}" value="${stall}" data-price="${prices[item][stall]}"> ${stall} (${prices[item][stall]}铜币)`;
                        priceDiv.appendChild(label);
                    });
                    div.appendChild(priceDiv);
                    form.appendChild(div);
                });

                const submit = document.createElement('button');
                submit.className = 'submit-shop';
                submit.textContent = '结算 (总价≤10铜币)';
                submit.addEventListener('click', () => {
                    let total = 0;
                    let allSelected = true;
                    items.forEach(item => {
                        const selected = document.querySelector(`input[name="${item}"]:checked`);
                        if (selected) {
                            total += parseInt(selected.dataset.price);
                        } else {
                            allSelected = false;
                        }
                    });

                    if (!allSelected) {
                        alert('请为所有物品选择摊位！');
                        return;
                    }

                    if (total <= 10) {
                        goToScene('shopping_success');
                    } else {
                        goToScene('shopping_fail');
                    }
                });
                form.appendChild(submit);

                interactionEl.appendChild(form);
            }

                else if (currentKey.startsWith('senate_q')) {
                    renderQuestion(currentKey, 'senateProgress', 'senate_explain', 4);
                }
                else if (currentKey.startsWith('investigation_q')) {
                    renderQuestion(currentKey, 'villageProgress', 'investigation_explain', 3);
                }
                else if (currentKey.startsWith('monastery_q')) {
                    renderQuestion(currentKey, 'monasteryProgress', 'monastery_explain', 3);
                }
                else if (currentKey.startsWith('cathedral_q')) {
                    renderQuestion(currentKey, 'cathedralProgress', 'cathedral_explain', 3);
                }
                else if (currentKey.startsWith('university_q')) {
                    renderQuestion(currentKey, 'universityProgress', 'university_explain', 3);
                }
                else if (currentKey.startsWith('tournament_q')) {
                    renderQuestion(currentKey, 'tournamentProgress', 'tournament_explain', 3);
                }
                else if (currentKey.startsWith('vitruvian_q')) {
                    renderQuestion(currentKey, 'vitruvianProgress', 'vitruvian_explain', 3);
                }
                else if (currentKey.startsWith('library_q')) {
                    renderQuestion(currentKey, 'libraryProgress', 'library_explain', 3);
                }
                else if (currentKey.startsWith('monalisa_q')) {
                    renderQuestion(currentKey, 'monaLisaProgress', 'monalisa_explain', 3);
                }
                else if (currentKey.startsWith('optics_q')) {
                    renderQuestion(currentKey, 'opticsProgress', 'optics_explain', 3);
                }
                else if (currentKey.startsWith('navigation_q')) {
                    renderQuestion(currentKey, 'navigationProgress', 'navigation_explain', 3);
                }
                // 第五章题目
                else if (currentKey.startsWith('timeline_q') && !currentKey.includes('explain')) {
                    renderQuestion(currentKey, 'timelineProgress', 'timeline_explain', 4);
                }
                else if (currentKey.startsWith('modern_quiz_q') && !currentKey.includes('explain')) {
                    renderQuestion(currentKey, 'modernQuizProgress', 'modern_explain', 12);
                }
                else if (currentKey.startsWith('exhibition_q') && !currentKey.includes('explain')) {
                    renderQuestion(currentKey, 'exhibitionProgress', 'exhibition_explain', 3);
                }
                // 第五章结尾特殊处理
                else if (currentKey === 'ending_part2') {
                    const endBtn = document.createElement('button');
                    endBtn.className = 'next-btn';
                    endBtn.textContent = '结束';
                    endBtn.addEventListener('click', () => {
                        goToScene('game_complete');
                    });
                    interactionEl.appendChild(endBtn);
                    return;
                }
                else if (scene.options) {
                    // 普通选项按钮
                    scene.options.forEach(opt => {
                        const btn = document.createElement('button');
                        btn.className = 'option-btn';
                        btn.textContent = opt.label;
                        btn.addEventListener('click', () => {
                            if (state.typing) return;
                            if (opt.skipTyping) state.skipTyping = true;
                            if (opt.next) goToScene(opt.next);
                        });
                        interactionEl.appendChild(btn);
                    });
                }
                else if (scene.next) {
                    const btn = document.createElement('button');
                    btn.className = 'next-btn';
                    btn.textContent = '➡️ 继续...';
                    btn.addEventListener('click', () => {
                        if (state.typing) return;
                        goToScene(scene.next);
                    });
                    interactionEl.appendChild(btn);
                }
            }

            // 通用题目渲染函数（多题进度），支持两位数题号
            function renderQuestion(qKey, progressKey, explainPrefix, totalQuestions) {
                const scene = scenes[qKey];
                const options = scene.options;
                const match = qKey.match(/\d+$/);
                const questionNumber = match ? parseInt(match[0]) : 0;
                const progress = state[progressKey] || 0;

                if (questionNumber !== progress + 1) {
                    const correctKey = qKey.replace(/\d+$/, progress + 1);
                    if (correctKey !== qKey) {
                        goToScene(correctKey);
                        return;
                    }
                }

                options.forEach(opt => {
                    const btn = document.createElement('button');
                    btn.className = 'option-btn';
                    btn.textContent = opt.label;
                    btn.addEventListener('click', () => {
                        if (state.typing) return;
                        if (opt.isCorrect) {
                            state.lastExplanation = opt.explanation;
                            state[progressKey] = progress + 1;
                            const explainKey = explainPrefix + (progress + 1);
                            goToScene(explainKey);
                        } else {
                            state.lastError = opt.explanation;
                            state.skipTyping = true;
                            renderScene();
                        }
                    });
                    interactionEl.appendChild(btn);
                });

                if (state.lastError) {
                    const errorDiv = document.createElement('div');
                    errorDiv.className = 'error-message';
                    errorDiv.textContent = '❌ ' + state.lastError;
                    interactionEl.appendChild(errorDiv);
                    state.lastError = null;
                }
            }

            // 单题渲染
            function renderSingleQuestion(qKey, successScene) {
                const scene = scenes[qKey];
                const options = scene.options;
                options.forEach(opt => {
                    const btn = document.createElement('button');
                    btn.className = 'option-btn';
                    btn.textContent = opt.label;
                    btn.addEventListener('click', () => {
                        if (state.typing) return;
                        if (opt.isCorrect) {
                            goToScene(successScene);
                        } else {
                            state.lastError = opt.explanation;
                            state.skipTyping = true;
                            renderScene();
                        }
                    });
                    interactionEl.appendChild(btn);
                });

                if (state.lastError) {
                    const errorDiv = document.createElement('div');
                    errorDiv.className = 'error-message';
                    errorDiv.textContent = '❌ ' + state.lastError;
                    interactionEl.appendChild(errorDiv);
                    state.lastError = null;
                }
            }

            function resetProgress() {
                state.knowledgePoints = 0;
                state.hieroglyphProgress = 0;
                state.quizProgress = 0;
                state.godsProgress = 0;
                state.debateProgress = 0;
                state.olympicProgress = 0;
                state.aqueductProgress = 0;
                state.senateProgress = 0;
                state.villageProgress = 0;
                state.monasteryProgress = 0;
                state.cathedralProgress = 0;
                state.universityProgress = 0;
                state.tournamentProgress = 0;
                state.vitruvianProgress = 0;
                state.libraryProgress = 0;
                state.monaLisaProgress = 0;
                state.opticsProgress = 0;
                state.navigationProgress = 0;
                state.timelineProgress = 0;
                state.modernQuizProgress = 0;
                state.exhibitionProgress = 0;
            }

            function goToScene(sceneKey) {
                if (!scenes[sceneKey]) return;
                stopTyping();
                onEnterScene(sceneKey);
                state.currentSceneKey = sceneKey;
                renderScene();
            }

            function resetGame() {
                stopTyping();
                state = {
                    currentSceneKey: 'start_page',
                    knowledgePoints: 0,
                    hieroglyphProgress: 0,
                    quizProgress: 0,
                    godsProgress: 0,
                    debateProgress: 0,
                    olympicProgress: 0,
                    aqueductProgress: 0,
                    senateProgress: 0,
                    villageProgress: 0,
                    monasteryProgress: 0,
                    cathedralProgress: 0,
                    universityProgress: 0,
                    tournamentProgress: 0,
                    vitruvianProgress: 0,
                    libraryProgress: 0,
                    monaLisaProgress: 0,
                    opticsProgress: 0,
                    navigationProgress: 0,
                    timelineProgress: 0,
                    modernQuizProgress: 0,
                    exhibitionProgress: 0,
                    typing: false,
                    typingInterval: null,
                    currentFullText: '',
                    currentSpeaker: '',
                    lastError: null,
                    skipTyping: false,
                };
                knowledgeSpan.textContent = '0';
                renderScene();
            }

            renderScene();
        })();
    </script>
</body>
</html>
